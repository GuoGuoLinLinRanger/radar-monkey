# Radar Monkey settings. Edit this, push, and the next scheduled run uses it.

[keep]
# Drop postings older than this many days (tracked jobs stay in your tracker anyway).
max_age_days = 60
# Keep closed postings for this many days so you can see "posting closed" on tracked jobs.
closed_grace_days = 14
# Drop jobs whose only source is in this list, including ones already saved. Jobright and
# Intern Insider expose no public apply link (every link lands on a sign-up wall), so we
# don't keep their postings around.
drop_sources = ["jobright", "interninsider"]

# ---------- Sources ----------

[sources.simplify]
enabled = true
# Public lists kept by SimplifyJobs on GitHub. Direct apply links, terms, sponsorship, degrees.
intern_url  = "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json"
newgrad_url = "https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json"

[sources.jobright]
# Off: every Jobright link lands on a jobright.ai sign-up wall, no real apply URL.
enabled = false
# Public daily lists Jobright posts on GitHub (last 7 days of postings, with work model).
repos = [
  { repo = "jobright-ai/2026-Software-Engineer-Internship", kind = "intern",  category = "Software" },
  { repo = "jobright-ai/2026-Data-Analysis-Internship",     kind = "intern",  category = "AI/ML/Data" },
  { repo = "jobright-ai/2026-Software-Engineer-New-Grad",   kind = "newgrad", category = "Software" },
  { repo = "jobright-ai/2026-Data-Analysis-New-Grad",       kind = "newgrad", category = "AI/ML/Data" },
]

[sources.jobright_api]
# Richer alternative to the GitHub mirror above: Jobright's own public minisite API
# (intern-list.com / newgrad-jobs.com) returns a whole category in one request with
# structured pay, visa flag and work model. Off by default; it overlaps the mirror
# (same jobs, folded by the deduper), so enable this and set [sources.jobright] off
# if you want the extra fields. Category ids: docs/jobright_categories.json.
enabled = false
countries = ["us", "ca"]
kinds = ["intern", "newgrad"]
categories = ["swe"]

[sources.interninsider]
# interninsider.me: a second list that the GitHub mirrors don't cover. Static site,
# one request per posting (cached after the first run), SWE decided by title.
# Off: Intern Insider exposes no public apply link (links go behind a login).
enabled = false
countries = ["US", "CA"]

# ---------- Extra detail (pay, full posting text) ----------
# Uses the official public job-board APIs of Greenhouse, Lever, Ashby and Workday.
# Newest postings are enriched first; the rest catch up over the next few runs.
[enrich]
enabled = true
max_per_run = 400

# ---------- Watchlist: companies you want to catch the minute they post ----------
# Polls the company's own job board every run. Find the board name in their careers URL:
#   job-boards.greenhouse.io/<board>   jobs.lever.co/<board>   jobs.ashbyhq.com/<board>
[watch]
# "intern(?!ational)" keeps "Intern" but not "International". Keep this filter in sync if you edit it.
title_regex = "(?i)intern(?!ational)|co-?op|new ?grad|university|graduate|early career|entry.level|\\bjunior\\b|apprentice"

# ===== Straight from the company's own careers site (official public APIs) =====
