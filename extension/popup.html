<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<style>
body { width: 300px; padding: 14px; }
h1 { font-size: 15px; margin: 0 0 10px; }
.stack { display: flex; flex-direction: column; gap: 7px; }
.row { display: flex; gap: 7px; }
.row .btn { flex: 1; text-align: center; }
#out { margin-top: 10px; font-size: 13px; }
#out ul { margin: 6px 0 0; padding-left: 18px; color: var(--warn); }
#out .ok { color: var(--good); font-weight: 600; }
footer { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; }
</style></head>
<body>
  <h1>Radar Monkey</h1>
  <div class="stack">
    <button class="btn primary" id="fill">Fill this page <span class="hint" style="color:inherit;opacity:.8">Alt+Shift+F</span></button>
    <button class="btn" id="learn">Remember my answers on this page</button>
    <div class="row"><button class="btn" id="applied">I applied</button><button class="btn" id="save">Save for later</button></div>
  </div>
  <div id="out" role="status"></div>
  <footer><a href="#" id="settings">Profile and answers</a><a href="#" id="dash" hidden>Open dashboard</a></footer>
<script src="popup.js"></script>
</body></html>
